{% extends 'base.html' %}
{% block content %}
<h2>New Scan</h2>
<form method="post">
  <fieldset>
    <legend>Search scope</legend>
    <label>Free-text query (optional)
      <input type="text" name="query" placeholder='e.g. "keystore" OR "wallet.dat" OR xprv'>
    </label>
    <div class="muted">If blank, providers will use a default query targeting common leak indicators.</div>

    <div style="display:flex; gap:1rem;">
      <label>Owner filter (provider-specific)
        <input type="text" name="owner" placeholder="e.g. github user/org">
      </label>
      <label>Language filter
        <input type="text" name="language" placeholder="e.g. Python, JavaScript">
      </label>
      <label>Max results per provider
        <input type="number" name="max_results" value="20" min="1" max="100">
      </label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Leak kinds</legend>
    <label><input type="checkbox" name="kinds" value="eth_priv" checked> ETH private keys</label>
    <label><input type="checkbox" name="kinds" value="btc_wif" checked> BTC WIF</label>
    <label><input type="checkbox" name="kinds" value="xprv" checked> BIP32 xprv</label>
    <label><input type="checkbox" name="kinds" value="keystore" checked> Keystore hints</label>
    <label><input type="checkbox" name="kinds" value="mnemonic" checked> Mnemonic hints</label>
  </fieldset>

  <fieldset>
    <legend>Providers</legend>
    <label><input type="checkbox" name="providers" value="github" checked> GitHub Code Search</label>
    <label><input type="checkbox" name="providers" value="gitlab" checked> GitLab Search</label>
    <label><input type="checkbox" name="providers" value="shodan" checked> Shodan (requires API key)</label>
  </fieldset>

  <button type="submit">Run Scan</button>
</form>
{% endblock %}
